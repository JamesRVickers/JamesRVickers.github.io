<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>James</title>
<style>
  :root{
    --bg: #ffffff;
    --text: #111111;
    --muted: #666666;
    --accent: #2b2b2b;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    line-height: 1.6;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 80px 24px;
  }
  h1{
    font-size: 28px;
    margin: 0 0 8px;
  }
  p{ margin: 0 0 16px; color: var(--muted); }
  nav a{
    color: var(--accent);
    text-decoration: none;
    margin-right: 16px;
    font-size: 14px;
  }
  nav a:hover{ text-decoration: underline; }
  section{ margin-top: 48px; }
  section h2{
    font-size: 16px;
    margin: 0 0 8px;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>James</h1>
    <p>Computer Science student, Victoria University of Wellington.</p>
    <nav>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="projects">
    <h2>Projects</h2>
    <p>—</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>your.email@example.com</p>
  </section>

</div>

</body>
</html>
